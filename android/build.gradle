group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

// AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin Gradle
// Plugin. Apply KGP only when built-in Kotlin is NOT active: that means AGP < 9,
// or AGP 9 with android.builtInKotlin=false (the configuration Flutter currently
// ships by default while the ecosystem migrates).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path    "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'

        // FaceUnity
        pickFirst 'lib/armeabi-v7a/libCNamaSDK.so'
        pickFirst 'lib/arm64-v8a/libCNamaSDK.so'
        pickFirst 'lib/armeabi-v7a/libfuai.so'
        pickFirst 'lib/arm64-v8a/libfuai.so'

        // WebRTC
        pickFirst 'lib/armeabi-v7a/libjingle_peerconnection_so.so'
        pickFirst 'lib/arm64-v8a/libjingle_peerconnection_so.so'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Configure the Kotlin JVM target. The compilerOptions DSL requires KGP 1.9+ or
    // AGP 9 built-in Kotlin; older Flutter app templates ship KGP 1.8.x, which only
    // supports the legacy kotlinOptions DSL.
    def kotlinExt = project.extensions.findByName('kotlin')
    if (kotlinExt?.hasProperty('compilerOptions')) {
        kotlin {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
            }
        }
    } else {
        android.kotlinOptions {
            jvmTarget = JavaVersion.VERSION_1_8.toString()
        }
    }

    sourceSets {
        main {
            jni {
                srcDirs 'src/main/jni', 'src/main/jniLibs'
            }
        }
    }

}

configurations.all {
    exclude group: 'com.faceunity', module: 'core'
    exclude group: 'com.faceunity', module: 'model'
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
    implementation 'com.github.davidliu:audioswitch:039a35aefab7747c557242fa216c9ea11743b604'
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"

    // Beauty Filters — FaceUnity
    // We use compileOnly because nertc_faceunity (or other plugins) may also provide these
    // classes via the com.faceunity:core maven dependency. If we use implementation on
    // local files, it causes CheckDuplicateClasses failures in the app.
    compileOnly files('libs/fu_core_all_feature_release.aar')
    compileOnly files('libs/fu_model_all_feature_release.aar')
}
