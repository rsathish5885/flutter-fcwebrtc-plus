name: flutter_webrtc_plus
description: Flutter WebRTC plugin for iOS/Android/Destkop/Web, based on GoogleWebRTC.
version: 1.2.0+1
homepage: https://github.com/waterbustech/flutter-webrtc-plus

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  collection: ^1.19.1
  dart_webrtc: ^1.8.1
  flutter:
    sdk: flutter
  logger: ^2.7.0
  path_provider: ^2.1.6
  universal_io: ^2.3.1
  web: ^1.1.1
  webrtc_interface: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  lints: ^6.1.0
  pedantic: ^1.11.1
  test: any


flutter:
  plugin:
    platforms:
      android:
        package: com.cloudwebrtc.webrtc
        pluginClass: FlutterWebRTCPlugin
      ios:
        pluginClass: FlutterWebRTCPlugin
      macos:
        pluginClass: FlutterWebRTCPlugin
      windows:
        pluginClass: FlutterWebRTCPlugin
      linux:
        pluginClass: FlutterWebRTCPlugin
      elinux:
        pluginClass: FlutterWebRTCPlugin
